spring.application.name=expense_tracker

#spring.datasource.url=${DATABASE_URL}
#spring.datasource.username=${DATABASE_USERNAME}
#spring.datasource.password=${DATABASE_PASSWORD}
# 1. The Port (Render provides this automatically)
server.port=${PORT:8080}

# 2. Database URL (Render provides 'DATABASE_URL' or 'SPRING_DATASOURCE_URL')
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/expense_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# 3. Hibernate (Crucial for PostgreSQL on Render)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

